# Order API の URL・要求・応答を OpenAPI 形式で定義し、実装と利用側の共通契約にします。
openapi: 3.1.0
info:
  title: Order API
  version: 1.2.0
  description: >-
    Immutable orders for an isolated lab. Creation requires Account existence via
    one bounded GET; unlike B1, unknown Accounts are rejected. Stored account_id
    remains historical: deleting an Account retains its Orders. Lookup does not
    guarantee ownership, authorization or atomicity against concurrent deletion.
    No cross-database foreign keys or authentication are provided.
    Order creation has no idempotency support: a retry after an ambiguous commit can duplicate an order.
paths:
  /api/orders:
    post:
      operationId: createOrder
      description: >-
        Validates input, looks up Account, then commits before responding. No DB
        transaction is held during HTTP. ORDER_ACCOUNT_URL selects a fixed origin;
        unset returns account_unconfigured. Lookup has a 2-second deadline including
        DNS/connect/headers/body, with a 5-second overall budget after validation.
        Earlier cancellation/deadlines propagate. W3C traceparent/tracestate and a
        validated or generated X-Request-ID propagate to Account; no automatic retry.
        Body at most 16384 bytes including whitespace.
        All keys required, no unknown or duplicate keys (including escaped spellings).
        Decimal/exponent integer spellings, null, non-object, invalid UTF-8 and trailing
        data are rejected. Content-Type application/json optionally with charset=utf-8.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Committed Order
          headers:
            Location:
              schema:
                type: string
              description: /api/orders/{id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Invalid'
        '413':
          description: payload_too_large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: unsupported_media_type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: account_not_found; no Order write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: account_bad_response; no Order write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: account_unconfigured, account_unavailable or Order unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: account_timeout; no Order write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
  /api/orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          description: Positive int64; lexical form [1-9][0-9]*.
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
      responses:
        '200':
          description: Persisted Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          description: not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/Internal'
  /api/orders/{id}/payments:
    post:
      operationId: createOrderPayment
      description: >-
        Validates the input, reads the Order, then sends one POST to Payment.
        order_id is derived from the path and is forbidden in the body. Strict
        JSON input rules and 16384-byte limit match Order creation. No redirects,
        automatic retries or proxy. Processing budget after validation is 5 seconds;
        the entire downstream call including DNS/connect/response body is at most
        2 seconds, bounded by the parent deadline. No Order state is changed.
        503/504 can mean a committed payment whose response was lost: manually
        resend the same request_id and identical input to recover the result.
        A decline is a recorded terminal result, not a successful payment.
        Location from Payment is never forwarded.
      parameters:
        - name: id
          in: path
          required: true
          description: Existing Order ID, positive int64 with lexical form [1-9][0-9]*.
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPaymentInput'
      responses:
        '201':
          description: New payment record; status is succeeded or declined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPayment'
        '200':
          description: Identical replay; same id, terminal status and created_at.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPayment'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          description: Order not_found; no downstream call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: method_not_allowed, Allow POST.
          headers:
            Allow:
              schema:
                const: POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: idempotency_conflict; same request_id with different valid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: payload_too_large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: unsupported_media_type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
        '502':
          description: payment_bad_response; invalid or unexpected downstream response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: >-
            payment_unconfigured, payment_unavailable or Order unavailable.
            An unavailable downstream can have committed; do not assume unpaid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: payment_timeout; outcome unknown, same-ID manual replay permitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /livez:
    get:
      operationId: liveness
      responses:
        '200':
          description: Process serving; remains healthy during shutdown drain.
  /readyz:
    get:
      operationId: readiness
      responses:
        '200':
          description: Order DB reachable and compatible migration version 1 within one second.
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  schemas:
    OrderInput:
      type: object
      additionalProperties: false
      required: [account_id, item_code, quantity]
      properties:
        account_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: Must exist when checked at creation; retained historically after deletion.
        item_code:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          minLength: 1
          maxLength: 64
        quantity:
          type: integer
          minimum: 1
          maximum: 999
    Order:
      type: object
      additionalProperties: false
      required: [id, account_id, item_code, quantity, created_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        account_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        item_code:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
        quantity:
          type: integer
          minimum: 1
          maximum: 999
        created_at:
          type: string
          format: date-time
          description: Database timestamp serialized as UTC RFC3339, possibly with fractional seconds.
    OrderPaymentInput:
      type: object
      additionalProperties: false
      required: [request_id, amount_minor, currency, simulate_result]
      properties:
        request_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          not:
            const: '00000000-0000-0000-0000-000000000000'
        amount_minor:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        currency:
          const: JPY
        simulate_result:
          enum: [success, decline]
    OrderPayment:
      type: object
      additionalProperties: false
      required: [id, request_id, order_id, amount_minor, currency, simulate_result, status, created_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        request_id:
          $ref: '#/components/schemas/OrderPaymentInput/properties/request_id'
        order_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        amount_minor:
          $ref: '#/components/schemas/OrderPaymentInput/properties/amount_minor'
        currency:
          const: JPY
        simulate_result:
          enum: [success, decline]
        status:
          enum: [succeeded, declined]
          description: success maps to succeeded; decline maps to declined.
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    Invalid:
      description: validation_error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: unavailable (DB unavailable, readiness incompatible or shutting down)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: internal_error; no SQL, DSN or request body disclosed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
