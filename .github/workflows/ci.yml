# GitHub の変更を受け取り、変更範囲に応じた検査と最終結果の集約を行う CI の入口です。
name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Publication can wait for an owner approval. Keep workflow-level concurrency
# unset so that wait never serializes the required validation of a later push.
# The publish job retains its own non-cancelling, per-service concurrency below.
defaults:
  run:
    shell: bash
jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.diff.outputs.docs }}
      base: ${{ steps.diff.outputs.base }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        run: python3 -I ci/github/classify.py
  docs:
    needs: classify
    if: needs.classify.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Documentation and secret checks
        env:
          DOCS_BASE: ${{ needs.classify.outputs.base }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work \
            -e DOCS_BASE="$DOCS_BASE" \
            --entrypoint sh aquasec/trivy:0.75.0@sha256:9db099105405c648166e6b94155eb32f8da12673cf1f455207f7385cc9a77283 -ec 'git config --global --add safe.directory /work; sh ci/docs-check.sh'
  validate:
    needs: classify
    if: needs.classify.outputs.docs != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: false
      - name: Policy and boundary tests
        run: bash ci/github/test.sh
      - name: Account delayed-input helper tests
        run: python3 -I performance/account/test_latency.py -v
      - name: Backend validation
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go build -trimpath -o .build/server ./cmd/server
          go build -trimpath -o .build/order-server ./cmd/order-server
      - name: Four-service disposable database compatibility
        env:
          FOUR_SERVICE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 -I ci/github/four_service_db_test.py -v
          docker pull postgres@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
          python3 -I ci/github/four_service_db.py
      - name: Remove four-service disposable databases
        if: always()
        env:
          FOUR_SERVICE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ids="$(docker ps -aq --filter "label=backend-four-service-run=$FOUR_SERVICE_RUN_ID")"
          if test -n "$ids"; then docker rm --force --volumes $ids; fi
          test -z "$(docker ps -aq --filter "label=backend-four-service-run=$FOUR_SERVICE_RUN_ID")"
      - name: Order to Account exported trace regression
        env:
          ORDER_DISPOSABLE_TEST: '1'
          TRACE_EVIDENCE_DIR: ${{ runner.temp }}/order-account-traces
        run: |
          docker pull postgres@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
          docker pull ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.161.0@sha256:b5cf983651c32c3ca13f936deb51742015a54d121f388cac248923ddeb8cc9fc
          go test -count=1 -v ./tests/distributedtrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: order-account-traces-${{ github.run_attempt }}
          path: ${{ runner.temp }}/order-account-traces/
          if-no-files-found: error
          retention-days: 7
      - name: Source and rendered security checks
        env:
          SECURITY_RENDER_REQUIRED: 'false'
        run: |
          bash ci/github/source-scan.sh
          python3 -I ci/github/source-identity.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-results-${{ github.run_attempt }}
          path: .security/public/
          include-hidden-files: true
          retention-days: 30
  sast:
    needs: classify
    if: needs.classify.outputs.docs != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: SAST policy and real engine fixtures
        env:
          SAST_REAL_TESTS: '1'
        run: |
          python3 -I ci/sast_test.py -v
          python3 -I ci/sast-workflow_test.py -v
          python3 -I ci/sonar-main_test.py -v
      - name: Semgrep CE full tracked source scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I ci/sast.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sast-semgrep-${{ github.run_attempt }}
          path: .security/sast/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  image:
    needs: [validate, sast]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, order]
    defaults:
      run:
        working-directory: .images/${{ matrix.service }}
    env:
      RELEASE_SERVICE: ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: .images/${{ matrix.service }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver-opts: image=moby/buildkit:v0.30.0-rootless@sha256:d76eb1caecac5733ef7553c1e90a1b21f1bb218cd1142d3553de0747b4a14ba9
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: security-results-${{ github.run_attempt }}
          path: .images/${{ matrix.service }}/.validation
      - name: Build trusted local validators
        run: |
          mkdir -p .security
          (cd tools/scan-gate; CGO_ENABLED=0 go build -o ../../.security/scan-gate .)
          (cd tools/oci-input; CGO_ENABLED=0 go build -o ../../.security/oci-runtime-export ./cmd/oci-runtime-export; CGO_ENABLED=0 go build -o ../../.security/github-oci-check ./cmd/github-oci-check; CGO_ENABLED=0 go build -o ../../.security/oci-crane-check ./cmd/oci-crane-check)
          (cd tools/release-record; CGO_ENABLED=0 go build -o ../../.security/sbom-check ./cmd/sbom-check)
      - name: Build, validate, isolated runtime, image policy and SBOM
        run: bash ci/github/oci.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checked-image${{ matrix.service == 'order' && '-order' || '' }}-${{ github.run_attempt }}
          path: |
            .images/${{ matrix.service }}/.oci/image.tar
            .images/${{ matrix.service }}/.security/public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [validate, image, ci-result]
    # docs is intentionally skipped on full CI; do not inherit its implicit success().
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.image.result == 'success' &&
      needs.ci-result.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.ref_protected && vars.ENABLE_GHCR_PUBLISH == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: [backend, order]
    defaults:
      run:
        working-directory: .images/${{ matrix.service }}
    env:
      RELEASE_SERVICE: ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ghcr-publish
    concurrency:
      group: ghcr-publication-${{ matrix.service }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: .images/${{ matrix.service }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: checked-image${{ matrix.service == 'order' && '-order' || '' }}-${{ github.run_attempt }}
          path: .images/${{ matrix.service }}
      - name: Verify artifact and compile registry tool
        run: |
          mkdir -p .security/bin
          (cd tools/oci-input; go build -o ../../.security/bin/github-oci-check ./cmd/github-oci-check)
          GOBIN="$PWD/.security/bin" go install github.com/google/go-containerregistry/cmd/crane@v0.21.7
          echo "$PWD/.security/bin" >> "$GITHUB_PATH"
      - name: Publish the checked layout and release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
        run: python3 -I ci/github/release.py publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-evidence${{ matrix.service == 'order' && '-order' || '' }}-${{ github.run_attempt }}
          path: .images/${{ matrix.service }}/.security/public/release-record.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  propose:
    needs: publish
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.ref_protected && vars.ENABLE_MANIFEST_PR == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: [backend, order]
    defaults:
      run:
        working-directory: .images/${{ matrix.service }}
    env:
      RELEASE_SERVICE: ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: manifest-update
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: .images/${{ matrix.service }}
          fetch-depth: 0
          persist-credentials: false
      - name: Propose a manifest update
        env:
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          GH_TOKEN: ${{ secrets.MANIFEST_WRITE_TOKEN }}
        run: python3 -I ci/github/release.py propose

  ci-result:
    if: always()
    needs: [classify, docs, validate, sast, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.classify.outputs.docs != 'true' && needs.image.result == 'success'
        with:
          pattern: checked-image-*
          path: .checked
      - name: Required check
        env:
          DOCS: ${{ needs.classify.outputs.docs }}
          CLASSIFY: ${{ needs.classify.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          VALIDATE: ${{ needs.validate.result }}
          SAST: ${{ needs.sast.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          test "$CLASSIFY" = success
          if test "$DOCS" = true; then test "$DOCS_RESULT" = success; else
            test "$VALIDATE" = success
            test "$SAST" = success
            test "$IMAGE" = success
            python3 -I ci/github/matrix-result.py
          fi
