# 固定済み GitHub artifact の Account OCI を隔離再検証し、明示承認時だけGHCRへ公開します。
name: Retained Account runtime refresh
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 検証済みの固定OCIをGHCRへ公開する
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: retained-account-runtime-refresh
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify and materialize the exact retained OCI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I ci/github/retained_runtime_refresh.py prepare
      - name: Build the unchanged local OCI transport helper
        run: |
          mkdir -p .security
          (cd tools/oci-input; CGO_ENABLED=0 go build -trimpath -o ../../.security/oci-runtime-export ./cmd/oci-runtime-export)
      - name: Re-run the unchanged isolated runtime contract
        env:
          RELEASE_SERVICE: backend
        run: |
          docker pull postgres@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
          python3 -I ci/github/runtime.py
      - name: Bind current GitHub issuer, exact runtime and fresh external scan hashes
        run: python3 -I ci/github/retained_runtime_refresh.py finalize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-account-runtime-${{ github.run_attempt }}
          path: .security/retained-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.publish
        with:
          name: retained-account-oci-${{ github.run_attempt }}
          path: .security/private/retained-runtime/.oci/image.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: runtime
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: retained-account-oci-${{ github.run_attempt }}
          path: retained
      - name: Publish only the exact canonical retained OCI
        env:
          GH_TOKEN: ${{ github.token }}
          DESTINATION: ghcr.io/syuhei0519/backend-app:source-635814f5354f
          EXPECTED_DIGEST: sha256:fba8eae42982a0e818581b2ac6b41ba865920dafdbfd7d48c416f98c5b1eaebd
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.21.7
          printf '%s' "$GH_TOKEN" | crane auth login ghcr.io -u '${{ github.actor }}' --password-stdin
          if crane manifest "$DESTINATION" >/dev/null 2>&1; then
            echo 'destination tag already exists; overwrite refused' >&2
            exit 1
          fi
          crane push retained/image.tar "$DESTINATION"
          test "$(crane digest "$DESTINATION")" = "$EXPECTED_DIGEST"
