# 固定済み GitHub artifact の Account OCI を隔離再検証し、明示承認時だけGHCRへ公開します。
name: Retained Account runtime refresh
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 検証済みの固定OCIをGHCRへ公開する
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  # 単独操作者のdispatchを直列化する。GHCR外部主体との原子的create-if-absent保証ではない。
  group: retained-account-runtime-refresh
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify and materialize the exact retained OCI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I ci/github/retained_runtime_refresh.py prepare
      - name: Build the unchanged local OCI transport helper
        run: |
          mkdir -p .security
          (cd tools/oci-input; CGO_ENABLED=0 go build -trimpath -o ../../.security/oci-runtime-export ./cmd/oci-runtime-export)
          (cd tools/scan-gate; go build -trimpath -o ../../.security/scan-gate .)
      - name: Rescan the exact retained OCI with a current database
        run: |
          mkdir -p .cache/retained-trivy .security/private/retained-rescan
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work --entrypoint sh \
            aquasec/trivy:0.75.0@sha256:9db099105405c648166e6b94155eb32f8da12673cf1f455207f7385cc9a77283 -ec '
              trivy image --download-db-only --db-repository ghcr.io/aquasecurity/trivy-db:2 --db-repository public.ecr.aws/aquasecurity/trivy-db:2 --cache-dir .cache/retained-trivy --timeout 5m --quiet > .security/private/retained-rescan/db.log 2>&1
              : > .security/private/retained-rescan/empty-ignore
              trivy image --input .oci/layout --cache-dir .cache/retained-trivy --skip-db-update --timeout 5m --quiet --no-progress \
                --scanners vuln,secret,misconfig --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
                --ignorefile .security/private/retained-rescan/empty-ignore --list-all-pkgs --format json \
                --output .security/private/retained-rescan/raw.json > .security/private/retained-rescan/scan.log 2>&1
            '
          python3 -I ci/github/retained_runtime_refresh.py bind-scan
      - name: Re-run the unchanged isolated runtime contract
        env:
          RELEASE_SERVICE: backend
        run: |
          docker pull postgres@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
          python3 -I ci/github/runtime.py
      - name: Bind current GitHub issuer, exact runtime and fresh external scan hashes
        run: python3 -I ci/github/retained_runtime_refresh.py finalize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-account-runtime-${{ github.run_attempt }}
          path: .security/retained-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.publish
        with:
          name: retained-account-oci-${{ github.run_attempt }}
          path: .security/private/retained-runtime/.oci/layout/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: runtime
    if: inputs.publish && vars.ENABLE_RETAINED_ACCOUNT_GHCR_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: retained-account-oci-${{ github.run_attempt }}
          path: retained
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: retained-account-runtime-${{ github.run_attempt }}
          path: evidence
      - name: Publish only the exact canonical retained OCI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.21.7
          (cd tools/oci-input; go build -o ../../oci-layout-push ./cmd/oci-layout-push)
          echo "$PWD" >> "$GITHUB_PATH"
          printf '%s' "$GH_TOKEN" | crane auth login ghcr.io -u '${{ github.actor }}' --password-stdin
          PATH="$PWD:$PATH" python3 -I ci/github/retained_publish.py retained evidence/receipt.json
