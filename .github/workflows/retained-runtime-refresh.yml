# 固定済み GitHub artifact の Account OCI だけを、公開せず隔離再実行します。
name: Retained Account runtime refresh
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: retained-account-runtime-refresh
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify and materialize the exact retained OCI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I ci/github/retained_runtime_refresh.py prepare
      - name: Build the unchanged local OCI transport helper
        run: |
          mkdir -p .security
          (cd tools/oci-input; CGO_ENABLED=0 go build -trimpath -o ../../.security/oci-runtime-export ./cmd/oci-runtime-export)
      - name: Re-run the unchanged isolated runtime contract
        env:
          RELEASE_SERVICE: backend
        run: |
          docker pull postgres@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
          python3 -I ci/github/runtime.py
      - name: Bind current GitHub issuer, exact runtime and fresh external scan hashes
        run: python3 -I ci/github/retained_runtime_refresh.py finalize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-account-runtime-${{ github.run_attempt }}
          path: .security/retained-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
